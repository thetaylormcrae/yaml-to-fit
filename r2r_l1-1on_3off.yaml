---
name: "R2R_L1 | 1min On 3min Off"
sport: running
steps:
  - type: warmup
    duration: 10m
  - repeat: 10
    steps:
      - type: active
        name: "1:00 On"
        duration: 1m
      - type: rest
        name: "3:00 Off"
        duration: 3m
  - type: cooldown
    duration: 5m