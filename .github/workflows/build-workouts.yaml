name: Build FIT Workouts

on:
  push:
    branches:
      - main
    paths:
      - 'workouts/**/*.yaml'
      - 'src/validate_workouts.py'
      - 'src/compile_fit.py'
      - 'requirements.txt'
      - '.github/workflows/build-workouts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate workout YAML schemas
        run: python src/validate_workouts.py

      - name: Compile YAML to FIT
        run: python src/compile_fit.py

      - name: Check if content hash already released
        id: version
        run: |
          HASH=$(sha256sum workouts/*/*.yaml src/compile_fit.py | sha256sum | cut -c1-7)
          EXISTING=$(git tag -l "*-${HASH}")
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "tag=v$(date -u +'%Y.%m.%d').${{ github.run_number }}-${HASH}" >> $GITHUB_OUTPUT
          fi

      - name: Upload compiled artifacts
        if: steps.version.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: workout-release-bundle
          path: |
            dist/*.fit
            dist/*.zip
            release_notes.md
          retention-days: 1

  release:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: workout-release-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "Workouts ${{ needs.build.outputs.tag }}"
          body_path: release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.fit
            dist/*.zip
