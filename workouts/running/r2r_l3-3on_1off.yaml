---
name: "R2R_L3 | 3min On 1min Off"
sport: running
steps:
  - type: warmup
    duration: 10m
  - repeat: 10
    steps:
      - type: active
        name: "3:00 On"
        duration: 3m
      - type: rest
        name: "1:00 Off"
        duration: 1m
  - type: cooldown
    duration: 5m