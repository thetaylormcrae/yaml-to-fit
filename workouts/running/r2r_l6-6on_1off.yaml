---
name: "R2R_L6 | 6min On 1min Off"
sport: running
steps:
  - type: warmup
    duration: 10m
  - repeat: 6
    steps:
      - type: active
        name: "6:00 On"
        duration: 6m
      - type: rest
        name: "1:00 Off"
        duration: 1m
  - type: cooldown
    duration: 5m