---
name: "R2R_L5 | 4min On 1min Off"
sport: running
steps:
  - type: warmup
    duration: 10m
  - repeat: 8
    steps:
      - type: active
        name: "4:00 On"
        duration: 4m
      - type: rest
        name: "1:00 Off"
        duration: 1m
  - type: cooldown
    duration: 5m