---
name: "R2R_L5 | 5min On 1min Off"
sport: running
steps:
  - type: warmup
    duration: 10m
  - repeat: 7
    steps:
      - type: active
        name: "5:00 On"
        duration: 5m
      - type: rest
        name: "1:00 Off"
        duration: 1m
  - type: cooldown
    duration: 5m